<body class="bg-deep-teal text-pure-white font-body min-h-screen flex flex-col justify-between p-gutter-md md:p-gutter-xl">

  <div class="max-w-7xl w-full mx-auto flex items-center justify-between">
    <a href="../homepage/Homepage.html" class="inline-flex items-center gap-2 text-pure-white hover:text-antique-gold font-body text-label-lg">
      <span class="material-symbols-outlined text-title-lg" aria-hidden="true">arrow_back</span>
      <span>Back to AARVIKA</span>
    </a>
  </div>

  <main class="max-w-md w-full mx-auto my-gutter-xl bg-surface text-on-surface rounded-xl p-gutter-xl shadow-2xl">
    <div class="text-center mb-gutter-lg">
      <svg class="w-20 h-6 mx-auto mb-1" viewBox="0 0 120 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M10 32L38 14L50 22L66 4L84 21L94 15L112 32H88L66 13L48 27L38 20L20 32H10Z" fill="#D8A64E"></path>
      </svg>
      <h1 data-design-text-token="headline-lg" class="font-headline text-headline-lg-mobile md:text-headline-lg text-deep-teal">Welcome to AARVIKA</h1>
      <p class="font-body text-body-md text-on-surface-variant mt-1">Sign in to manage bookings, saved trips, and wishlists.</p>
    </div>

    <form id="signin-form" class="space-y-gutter-md">
      <div>
        <label for="signin-email" class="font-body text-label-md text-charcoal block mb-1">Email address</label>
        <input id="signin-email" type="email" required placeholder="ananya@aarvika.com" class="w-full rounded-md border border-outline-variant bg-pure-white px-gutter-md py-2.5 text-body-md text-charcoal focus:border-deep-teal focus:ring-1 focus:ring-deep-teal">
      </div>
      <div>
        <label for="signin-password" class="font-body text-label-md text-charcoal block mb-1">Password</label>
        <input id="signin-password" type="password" required placeholder="••••••••" class="w-full rounded-md border border-outline-variant bg-pure-white px-gutter-md py-2.5 text-body-md text-charcoal focus:border-deep-teal focus:ring-1 focus:ring-deep-teal">
      </div>
      <button type="submit" class="w-full rounded-full bg-antique-gold hover:bg-antique-gold-hover text-charcoal font-body text-label-lg py-3 transition-colors shadow-sm">
        Sign In
      </button>
    </form>

    <div id="signin-status" class="hidden mt-gutter-md rounded-md bg-secondary-container p-gutter-md text-on-secondary-container text-body-sm text-center" role="status">
      Demo authentication active. Redirecting to Trip Planner...
    </div>

    <p class="font-body text-body-sm text-on-surface-variant text-center mt-gutter-lg">
      New to AARVIKA? <a href="../trip-planner/TripPlanner.html" class="text-deep-teal font-semibold underline">Start planning as guest</a>
    </p>
  </main>

  <footer class="text-center text-body-sm text-pure-white/70">
    © 2026 AARVIKA · Travel · Explore · Experience
  </footer>

  <script>
    (function () {
      var form = document.getElementById('signin-form');
      var status = document.getElementById('signin-status');
      if (form && status) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          status.classList.remove('hidden');
          setTimeout(function () {
            window.location.href = '../trip-planner/TripPlanner.html';
          }, 900);
        });
      }
    })();
  </script>


</body></html>
